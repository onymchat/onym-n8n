# onym-n8n dev-env compose stack — base file.
#
# This file defines the stack-wide services (caddy + n8n + manager-agent).
# The N employee-agent containers live in docker-compose.employees.yml,
# which is GENERATED by bin/render-employees-compose.sh from
# employees.json. Always bring the stack up via bin/up.sh — it renders
# the overlay and then runs `docker compose -f base -f overlay up`.
#
# Networks:
#   orchestration  — caddy + n8n + manager-agent (n8n's only outbound)
#   employees-net  — manager-agent + every employee (managed in the
#                    overlay; declared as `external: false` here)
#
# n8n knows about exactly one SSH target: manager-agent. It has zero
# direct knowledge of employees — the manager dispatches.
#
# Caddy is the only service with a public port (80 + 443). Every other
# service is loopback-bound (n8n on 5678 for /healthz only) or
# orchestration-net-internal (manager).

name: onym-n8n

services:
  manager-agent:
    image: onym-n8n/dev-env-agent:latest
    platform: linux/arm64
    container_name: onym-manager-agent
    hostname: manager-agent
    build:
      context: .
      dockerfile: Dockerfile.agent
      platforms:
        - linux/arm64
    tmpfs:
      - /run
      - /run/sshd
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - AUDIT_WRITE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      ROLE: manager
      EMPLOYEE_LOGIN: manager
      NODE_OPTIONS: "--max-old-space-size=4096"
    env_file:
      - path: ./manager.env
        required: false
    volumes:
      - manager-home:/home/agent
      - manager-cache:/cache
      # The dispatcher reads these on every invocation. Mounted read-only
      # so a compromised manager can't rewrite its own routing config.
      # Edit either file on the host and the next dispatch picks up the
      # change — no rebuild, no restart.
      - ./employees.json:/etc/onym/employees.json:ro
      - ./manager/routing-prompt.tmpl:/etc/onym/routing-prompt.tmpl:ro
    networks:
      - orchestration
      - employees-net
    mem_limit: 4g
    memswap_limit: 6g
    cpus: 2.0

  n8n:
    image: n8nio/n8n:latest
    platform: linux/arm64
    container_name: onym-n8n
    hostname: n8n
    env_file:
      # required: true — n8n.env carries N8N_ENCRYPTION_KEY. If it
      # silently fails to load, n8n auto-generates a fresh key, which
      # leaves every previously-stored credential undecryptable on next
      # boot ("Credentials for 'GitHub API' are not set" at workflow
      # runtime, even though the rows still exist in the DB). Fail fast.
      - path: ./n8n.env
        required: true
    environment:
      # N8N_HOST + WEBHOOK_URL come from n8n.env (must match caddy.env's
      # N8N_PUBLIC_HOST). The values below are the protocol-level
      # switches that have to be HTTPS now that Caddy terminates TLS.
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      N8N_PAYLOAD_SIZE_MAX: "64"
      N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"
    ports:
      # Loopback only — used by bin/doctor.sh's /healthz check. UI flows
      # must go through Caddy at https://$N8N_PUBLIC_HOST/.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - orchestration
    restart: unless-stopped
    mem_limit: 5g
    memswap_limit: 7g
    cpus: 2.0

  caddy:
    image: caddy:2-alpine
    container_name: onym-caddy
    hostname: caddy
    env_file:
      - path: ./caddy.env
        required: false
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - orchestration
    restart: unless-stopped

volumes:
  manager-home:
  manager-cache:
  n8n-data:
  caddy-data:
  caddy-config:

networks:
  orchestration:
    driver: bridge
  employees-net:
    name: onym-n8n_employees-net
    driver: bridge
